- title: Research Experience
  type: time_table
  contents:
    - title: Graduate Research Assistant
      institution: Scientific Computing and Biofluids Lab, Texas A&M University
      year: Aug 2021 - Present
      description:
        - "Advisor: Dr. Iman Borazjani"
        - "<strong>PICurv - Eulerian-Lagrangian Solver for Turbulent Scalar Transport (Jan 2024 - Present):</strong> Developing a high-fidelity solver for scalar <a href='https://en.wikipedia.org/wiki/Probability_density_function'>Filtered Density Function (FDF)</a> transport within the <a href='https://github.com/imanbj/CURVIB'>CURVIB</a> immersed boundary framework. Implementing Eulerian-Lagrangian coupling and solving stochastic particle methods (Langevin equation) to model sub-grid scalar fluctuations in turbulent flows. Building a modular, <a href='https://vishalkandala.github.io/PICurv/'>well-documented</a>, <a href='https://github.com/VishalKandala/PICurv'>open-source</a> tool with focus on robust software engineering. Optimizing parallel scalability to handle millions of particles across 1,000+ cores using C/C++, MPI, and PETSc."
        - "<strong>Biomedical Computational Mechanics Projects (May 2021 - Dec 2023):</strong> Conducted high-resolution, unsteady fluid-structure interaction simulations of pulsatile blood flow in LVAD outflow grafts. Analyzed wall shear stress, vorticity, and flow stasis to quantify thrombosis and hemolysis risk. <a href='https://meetings.aps.org/Meeting/DFD23/Session/X14.8'>Presented</a> detailed analysis at the 76th Annual APS Division of Fluid Dynamics meeting. Developed physics-informed regression model for right ventricular pressure-volume dynamics in collaboration with the <a href='https://avazmohammadi.engr.tamu.edu/'>Cardiovascular and Computational Biomechanics Lab</a>, achieving 40-60% reduction in prediction error. Manuscript in preparation for Nature Scientific Reports."
    
    - title: Undergraduate Research Assistant
      institution: VIT University, Chennai, India
      year: Jun 2017 - May 2018
      description:
        - "Advisor: Dr. Harish Rajan"
        - "Conducted design optimization study for modified double-spiked reentry capsule using ANSYS Fluent to mitigate aerothermal loads. Achieved 25% drag reduction and 16% surface temperature reduction for optimized configuration. <a href='https://vishalkandala.me/assets/pdf/undergraduate_publication.pdf'>Technical report available</a>."

